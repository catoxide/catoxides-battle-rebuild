// ============================================================
// ContentPack: sable-base-pack
// 引用方向：本包 ──▶ core（根项目），永不反向。
// 构建约定全部在 ../contentpack.gradle（共享单一真源）。
// ============================================================
plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev'
}
apply from: '../contentpack.gradle'

dependencies {
    // sable 物理库：compileOnly（仅编译期可见，不打进产物）。
    // 运行时由 mods/ 里的 sable mod 经 ChildFirstClassLoader parent-only 提供。
    // 与根项目写法一致（含同样的 exclude，避免拉入无关传递依赖）。
    compileOnly("dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_version}") {
        exclude group: 'foundry.veil'
        exclude group: 'fuzs.forgeconfigapiport'
        exclude group: 'com.simibubi.create'
    }
}
