<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<!-- REVIEW-L3：与主窗口同款 CSP（此前无 CSP，纵深防御缺失） -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
<title>片段 3D 编辑器</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="ed-body">
  <!-- P11 片段 3D 编辑器：独立窗口（Photoshop/Blender 式：顶栏 + 左侧工具栏 + 画布 + 状态栏） -->
  <!-- P15：底部 9×N 方块槽位缓存栏（等距投影图标）+ 快捷键 + 框选工具 + 按工具提示 -->
  <header class="ed-topbar">
    <span class="ed-logo">🧱 <span data-i18n="structure.piece3d.winTitle">片段 3D 编辑</span></span>
    <select id="edPiece" title=""></select>
    <div class="block-search" id="edSearchWrap">
      <input id="edBlock" value="minecraft:stone_bricks" style="width:200px" data-i18n-ph="structure.3d.edit.searchPh" placeholder="搜索方块（ID 子串）…">
      <div id="edBlockList" class="block-search-list"></div>
    </div>
    <button class="btn ghost small" id="edBtnJigsaw" data-i18n-title="structure.3d.edit.jigsawBtnTip">🧩 <span data-i18n="structure.3d.edit.jigsawBtn">拼图方块</span></button>
    <button class="btn ghost small" id="edBtnVoid" data-i18n-title="structure.3d.edit.voidBtnTip">⬚ <span data-i18n="structure.3d.edit.voidBtn">结构空位</span></button>
    <span class="note" id="edSrcNote"></span>
    <span class="ed-spacer"></span>
    <button class="btn ghost small" id="edUndo" data-i18n="structure.3d.edit.undo">↩ <span data-i18n="structure.3d.edit.undo">撤销编辑</span></button>
    <span class="note" id="edInfo"></span>
    <button class="btn small" id="edSave">💾 <span data-i18n="structure.piece3d.save">写回</span></button>
  </header>
  <div class="ed-main">
    <aside class="ed-tools">
      <div class="ed-toolgroup">
        <div class="ed-group-title" data-i18n="structure.piece3d.tools">工具</div>
        <button class="ed-tool active" data-tool="move" data-i18n-title="structure.piece3d.toolMoveTip">✥<span data-i18n="structure.piece3d.toolMove">移动</span></button>
        <button class="ed-tool" data-tool="paint" data-i18n-title="structure.3d.edit.toolPaint">🖌<span data-i18n="structure.piece3d.toolPaint">笔刷</span></button>
        <button class="ed-tool" data-tool="box" data-i18n-title="structure.piece3d.toolBoxTip">▭<span data-i18n="structure.piece3d.toolBox">框选</span></button>
        <button class="ed-tool" data-tool="placeholder" data-i18n-title="structure.3d.edit.toolPlaceholder">▣<span data-i18n="structure.piece3d.toolPlaceholder">占位</span></button>
      </div>
      <div class="ed-toolgroup">
        <div class="ed-group-title" data-i18n-title="structure.piece3d.slotRowsTip"><span data-i18n="structure.piece3d.slotRows">槽位行数</span></div>
        <input id="edSlotRows" type="number" min="1" max="6" value="3" style="width:52px" data-i18n-title="structure.piece3d.slotRowsTip">
      </div>
      <div class="ed-toolgroup">
        <div class="ed-group-title" data-i18n-title="structure.3d.edit.sliceTip"><span data-i18n="structure.3d.edit.slice">剖切</span></div>
        <select id="edSliceAxis">
          <option value="off" data-i18n="structure.3d.edit.sliceOff">关</option>
          <option value="x">X</option><option value="y">Y</option><option value="z">Z</option>
        </select>
        <div class="ed-slicerow">
          <input id="edSliceI" type="range" min="0" max="7" value="0" style="flex:1">
          <span class="note" id="edSliceLabel">0</span>
        </div>
      </div>
      <div class="ed-toolgroup">
        <div class="ed-group-title" data-i18n="structure.3d.ghostAsm">jigsaw 虚影拼合</div>
        <label class="chk"><input type="checkbox" id="edChkGhost"> <span data-i18n="structure.3d.ghostOn">显示虚影</span></label>
        <select id="edSelGhostMode" title="">
          <option value="pool" data-i18n="structure.3d.ghostPool">池逻辑</option>
          <option value="manual" data-i18n="structure.3d.ghostManual">手动</option>
        </select>
        <div style="display:flex;gap:4px">
          <button class="btn ghost small" id="edBtnGhostPrev" title="">◀ <span data-i18n="structure.3d.ghostPrev">上一个</span></button>
          <button class="btn ghost small" id="edBtnGhostNext" title="">▶ <span data-i18n="structure.3d.ghostNext">下一个</span></button>
        </div>
        <button class="btn ghost small" id="edBtnGhostReroll" data-i18n-title="structure.3d.ghostReroll">🎲</button>
        <label class="chk"><span data-i18n="structure.3d.ghostOp">虚化</span> <input id="edInpGhostOp" type="range" min="10" max="80" value="35" style="width:70px"></label>
        <span class="note" id="edGhostInfo" style="display:block;word-break:break-all;max-height:96px;overflow:auto"></span>
      </div>
      <div class="ed-toolgroup">
        <div class="ed-group-title" data-i18n="structure.piece3d.view">视角</div>
        <button class="ed-tool" id="edResetView" data-i18n-title="structure.3d.reset">⌂<span data-i18n="structure.3d.reset">重置视角</span></button>
      </div>
      <div class="ed-toolgroup ed-toolgroup-tip">
        <div class="note" data-i18n="structure.piece3d.rightTip">右键单击 = 相邻格放置 · 中键 = NBT 菜单（移动）/ 补货槽位（笔刷）· Shift = 移动/笔刷切换</div>
      </div>
    </aside>
    <div class="ed-canvaswrap" id="edCanvasWrap">
      <canvas id="edCanvas" width="900" height="600"></canvas>
      <div id="edCtx" class="ed-ctx" style="display:none"></div>
      <div id="edPalette" class="ed-palette"></div>
    </div>
  </div>
  <footer class="ed-statusbar">
    <span class="note" id="edStatus"></span>
    <span class="note ed-spacer"></span>
    <span class="note" id="edHint"></span>
  </footer>
  <script src="lib/errorCapture.js"></script> <!-- REVIEW-L3：渲染端错误捕获（与主窗口/模型编辑器一致） -->
  <script src="i18n.js"></script>
  <script src="core/voxel.js"></script>
  <script src="core/structureGrowth.js"></script> <!-- P16b 虚影拼合（self.StructureGrowth） -->
  <script src="views/pieceEditor.js"></script>
</body>
</html>
